<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>AgriCrop Disease Map</title>

    <link rel="stylesheet"
        href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

    <style>

        body{
            margin:0;
            font-family:Arial, Helvetica, sans-serif;
            background:#f5f5f5;
        }

        h1{
            text-align:center;
            background:#2e7d32;
            color:white;
            margin:0;
            padding:18px;
        }

        #map{
            height:90vh;
            width:100%;
        }

    </style>

</head>

<body>

<h1>🌱 AgriCrop Geospatial Disease Map</h1>

<div id="map"></div>

<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

<script>

var map = L.map('map');

L.tileLayer(
'https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',
{
    maxZoom:19,
    attribution:'© OpenStreetMap'
}).addTo(map);

var markers=[];

{% for row in records %}

var lat={{ row.latitude }};
var lng={{ row.longitude }};

var disease="{{ row.disease }}";
var crop="{{ row.crop }}";
var confidence="{{ row.confidence }}";
var soil="{{ row.soil }}";

var color="green";

if(!disease.toLowerCase().includes("healthy")){
    color="red";
}

var marker=L.circleMarker(
    [lat,lng],
    {
        radius:10,
        color:color,
        fillColor:color,
        fillOpacity:0.8
    }
).addTo(map);

marker.bindPopup(
"<h3>"+crop+"</h3>"+
"<b>Disease:</b> "+disease+
"<br><b>Confidence:</b> "+confidence+"%"+
"<br><b>Soil Moisture:</b> "+soil+"%"
);

markers.push([lat,lng]);

{% endfor %}

// Automatically zoom to all markers
if(markers.length>0){

    var bounds=L.latLngBounds(markers);

    map.fitBounds(bounds,{padding:[50,50]});

}else{

    map.setView([20.5937,78.9629],5);

}

</script>

<footer>

© 2026 AgriCrop | AI Powered Plant Disease Detection & Soil Moisture Intelligence

</footer>

</body>

</html>
